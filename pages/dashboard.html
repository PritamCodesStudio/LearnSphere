<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student dashboard — LearnSphere Academy</title>
  <meta name="description" content="Explore the LearnSphere Academy demo dashboard: sample enrollments, progress tracking, saved courses, activity and local profile settings.">
  <meta name="theme-color" content="#f8f7f4">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script>
    (function(){try{var s=localStorage.getItem('learnsphere.theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s==='dark'||s==='light'?s:(d?'dark':'light'));document.documentElement.classList.add('js');}catch(e){document.documentElement.classList.add('js');}})();
  </script>
</head>
<body data-page="dashboard" data-root="../" class="dashboard-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="section" style="padding-top:clamp(1.75rem,3vw,2.5rem)">
      <div class="container">
        <div id="dashboard-app">
          <noscript><p class="notice">JavaScript is needed to render the demo dashboard. You can still browse the <a href="../pages/courses.html">course catalogue</a>.</p></noscript>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../js/icons.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
